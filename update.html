<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#17132d"><title>MEMORY BEATを更新</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><section class="card"><span class="eyebrow">MEMORY BEAT</span><h1>アプリを更新</h1><p id="status" role="status">最新版を準備しています…</p><p class="muted">登録済みの問題と学習履歴を保持したまま更新します。</p><a id="open-app" class="primary wide" style="display:block;text-align:center;text-decoration:none" href="./">アプリを開く</a><button id="retry" class="secondary wide" hidden>更新を再試行</button></section></main><script type="module">
import { activateUpdate } from './js/pwa.js';
const status = document.querySelector('#status'), retry = document.querySelector('#retry');
async function update() {
  retry.hidden = true;
  try {
    if ('serviceWorker' in navigator) {
      const registration = await navigator.serviceWorker.register('./sw.js');
      await activateUpdate(registration);
    }
    status.textContent = '更新しました。アプリを開きます…'; location.replace('./');
  } catch (error) { status.textContent = error.message; retry.hidden = false; }
}
retry.addEventListener('click', update); update();
</script></body></html>
